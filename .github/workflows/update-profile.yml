name: Sync Profile README

on:
  schedule:
    # Runs at 00:00 UTC daily
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/projects.json'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Profile Auto-Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Auto-Commit & Push Updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): sync projects & live activity [skip ci]"
          file_pattern: "README.md stats/**"
