name: Sync Profile README

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      focus_project:
        description: 'Project name currently building (leave empty to keep current)'
        required: false
        type: string
      focus_text:
        description: 'Focus summary or milestone (leave empty to keep current)'
        required: false
        type: string
      focus_url:
        description: 'Target repository or spec URL (leave empty to keep current)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Profile Auto-Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_FOCUS_PROJECT: ${{ inputs.focus_project }}
          INPUT_FOCUS_TEXT: ${{ inputs.focus_text }}
          INPUT_FOCUS_URL: ${{ inputs.focus_url }}
        run: node scripts/update-profile.mjs

      - name: Run Quality Gate Tests
        run: npm test

      - name: Pull Remote Changes (Prevent Race Conditions)
        run: |
          git fetch origin main
          git rebase origin/main || git merge --abort || true

      - name: Auto-Commit & Push Updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): sync projects & live activity [skip ci]"
          file_pattern: "README.md stats/** data/status.json assets/**"
          skip_fetch: false
