name: Sync Profile README

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/projects.json'
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Profile Auto-Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Pull Remote Changes (Prevent Race Conditions)
        run: |
          git fetch origin main
          git rebase origin/main || git merge --abort || true

      - name: Auto-Commit & Push Updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): sync projects & live activity [skip ci]"
          file_pattern: "README.md stats/**"
          skip_fetch: false
