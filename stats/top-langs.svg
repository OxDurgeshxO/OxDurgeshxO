<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bg: #1a1b27;
      --border: #24283b;
      --track: #24283b;
      --title: #70a5fd;
      --label: #a9b1d6;
      --stat: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --border: #e2e8f0;
        --track: #e2e8f0;
        --title: #0284c7;
        --label: #475569;
        --stat: #0f172a;
      }
    }
    .card-bg { fill: var(--bg); stroke: var(--border); }
    .bar-track { fill: var(--track); }
    .title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; fill: var(--title); }
    .label { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; fill: var(--label); }
    .stat { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; fill: var(--stat); }
  </style>
  <rect x="0.5" y="0.5" rx="10" height="99%" width="494" class="card-bg" stroke-width="1"/>
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="title">Most Used Languages</text>
  </g>
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="440" height="10" rx="5" class="bar-track"/>
    <g><rect x="0" y="0" width="304.2" height="10" fill="#3178c6" rx="2"/><rect x="304.2" y="0" width="92.5" height="10" fill="#3572A5" rx="2"/><rect x="396.7" y="0" width="19.0" height="10" fill="#f1e05a" rx="2"/><rect x="415.7" y="0" width="15.2" height="10" fill="#e34c26" rx="2"/><rect x="430.9" y="0" width="4.8" height="10" fill="#89e051" rx="2"/></g>
  </g>
  <g transform="translate(25, 85)">
    
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#3178c6"/>
      <text x="22" y="10" class="label">TypeScript</text>
      <text x="160" y="10" class="stat">69.1%</text>
    </g>
  
    <g transform="translate(0, 24)">
      <circle cx="6" cy="6" r="5" fill="#3572A5"/>
      <text x="22" y="10" class="label">Python</text>
      <text x="160" y="10" class="stat">21.0%</text>
    </g>
  
    <g transform="translate(0, 48)">
      <circle cx="6" cy="6" r="5" fill="#f1e05a"/>
      <text x="22" y="10" class="label">JavaScript</text>
      <text x="160" y="10" class="stat">4.3%</text>
    </g>
  
    
    <g transform="translate(220, 0)">
      <circle cx="6" cy="6" r="5" fill="#e34c26"/>
      <text x="22" y="10" class="label">HTML</text>
      <text x="160" y="10" class="stat">3.4%</text>
    </g>
  
    <g transform="translate(220, 24)">
      <circle cx="6" cy="6" r="5" fill="#89e051"/>
      <text x="22" y="10" class="label">Shell</text>
      <text x="160" y="10" class="stat">1.1%</text>
    </g>
  
  </g>
</svg>